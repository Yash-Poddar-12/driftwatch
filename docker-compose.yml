# docker-compose.yml — local development orchestration for DriftWatch.
#
# Design notes (AGENTS.md §1 — explain every choice):
#
#  Kafka image: apache/kafka:4.3.1 (official Apache image, KRaft mode).
#    Kafka 4.x removed ZooKeeper completely; KRaft is the only mode.
#    We do NOT use bitnami/kafka — Bitnami moved free images to a legacy,
#    unmaintained repository.
#
#  KRaft single-node: KAFKA_PROCESS_ROLES=broker,controller means this one
#    container handles both client connections (broker) AND cluster metadata
#    (controller — the role ZooKeeper used to fill).  Fine for local dev;
#    in production these roles run on separate nodes.
#
#  ADVERTISED_LISTENERS vs LISTENERS: Kafka binds on the LISTENERS addresses
#    internally, but tells clients to reconnect to ADVERTISED_LISTENERS.
#    PLAINTEXT://kafka:9092  — used by other Docker containers (producers).
#    PLAINTEXT_HOST://localhost:29092 — lets you run a console consumer on
#    your laptop with: kafka-console-consumer.sh --bootstrap-server localhost:29092
#
#  depends_on condition:service_healthy: producers wait for Kafka's HEALTHCHECK
#    to report healthy before starting, avoiding startup-race "Connection refused".
#
#  Three producer replicas, same image, different SERVICE_NAME/REGION env vars.
#    Demonstrates README §2.3 "config via environment, not code" and gives the
#    detector realistic multi-service data from the very first run.

version: "3.9"

# --------------------------------------------------------------------------- #
# Networks                                                                      #
# --------------------------------------------------------------------------- #
networks:
  driftwatch:
    driver: bridge

# --------------------------------------------------------------------------- #
# Services                                                                      #
# --------------------------------------------------------------------------- #
services:

  # ── Kafka (KRaft mode, single-node) ─────────────────────────────────────── #
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - driftwatch
    ports:
      # 29092 → exposed to the host so you can use kafka-console-consumer.sh
      # from your laptop to verify events are flowing (Phase 1 verification).
      - "29092:29092"
    environment:
      # ── KRaft cluster identity ──────────────────────────────────────────── #
      # CLUSTER_ID: a stable UUID shared by all brokers in the cluster.
      # In a single-node setup it's arbitrary but must stay consistent across
      # restarts (stored in the data volume below).
      KAFKA_KRAFT_CLUSTER_ID: "driftwatch-local-dev-cluster-01"

      # KAFKA_NODE_ID: the numeric broker ID for this node.
      KAFKA_NODE_ID: "1"

      # PROCESS_ROLES: broker = handles producers/consumers; controller =
      # manages cluster metadata (replaces ZooKeeper in KRaft).
      # Single-node runs both roles in one container.
      KAFKA_PROCESS_ROLES: "broker,controller"

      # CONTROLLER_QUORUM_VOTERS: <node_id>@<host>:<controller_port>
      # With one node, the quorum is just itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      # ── Listeners ──────────────────────────────────────────────────────── #
      # LISTENERS — what Kafka binds on inside the container.
      #   CONTROLLER://  is the internal Raft/metadata channel.
      #   PLAINTEXT://   is the broker channel for Docker-networked clients.
      #   PLAINTEXT_HOST:// is a second broker channel bound to all interfaces
      #                   so the host machine can reach port 29092.
      KAFKA_LISTENERS: "CONTROLLER://kafka:9093,PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092"

      # ADVERTISED_LISTENERS — what clients are told to reconnect to.
      # Producers inside Docker use kafka:9092.
      # Host-side tools use localhost:29092.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"

      # Map the listener names to their security protocols.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      # Which listener the controller uses for inter-broker Raft traffic.
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # ── Topic / retention defaults ──────────────────────────────────────── #
      # Auto-create the logs.raw topic on first publish.  Disabling
      # auto-create later (in prod) is a best practice, but for local
      # iteration this is convenient.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # 3 partitions for logs.raw lets the future detector run 3 parallel
      # consumer threads, one per partition (consumer group parallelism).
      KAFKA_NUM_PARTITIONS: "3"

      # Replication factor 1 is correct for a single-node cluster.
      # (You cannot replicate to more brokers than exist.)
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Retain logs for 24 hours locally (adjust for longer-running tests).
      KAFKA_LOG_RETENTION_HOURS: "24"
    healthcheck:
      # Use Kafka's own kafka-topics.sh as a health probe — if it can list
      # topics, the broker is fully ready for connections.
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      # Persist Kafka data across docker compose down/up cycles.
      # Without this, every restart clears all topics and offsets.
      - kafka-data:/tmp/kraft-combined-logs

  # ── TimescaleDB (Phase 3) ────────────────────────────────────────────────── #
  #
  # WHY timescale/timescaledb:latest-pg16?
  #   TimescaleDB tags by Postgres major version rather than a single numeric
  #   release (their standard convention, analogous to postgres:16).
  #   latest-pg16 always pulls the most recent TimescaleDB release built
  #   against Postgres 16, which is the current LTS Postgres version.
  #
  # WHY not use the standard postgres image?
  #   TimescaleDB extends Postgres with automatic time-based chunking
  #   (hypertables), efficient time-range queries, and compression — none of
  #   which are available in the vanilla postgres image.  The timescaledb
  #   image IS Postgres (same binary), just with the extension pre-installed.
  #
  # WHY mount init.sql via /docker-entrypoint-initdb.d/?
  #   Postgres (and TimescaleDB) automatically runs any .sql or .sh files in
  #   this directory on the FIRST boot (when the data directory is empty).
  #   This is the standard Postgres pattern for seeding schemas without a
  #   manual psql step.  On subsequent restarts the data directory already
  #   exists so the init scripts are skipped, preventing re-creation errors.
  #
  # WHY a named volume (timescaledb-data)?
  #   Named volumes persist across `docker compose down` + `up` cycles.
  #   Anonymous volumes (no name) are deleted by `docker compose down -v`.
  #   For a database this distinction is critical — losing all your metrics
  #   data on every restart defeats the purpose of having a database.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    networks:
      - driftwatch
    ports:
      # 5432 exposed to the host so you can query directly with psql:
      #   psql -h localhost -U driftwatch -d driftwatch
      # (useful for the verification step in Phase 3 — "did rows land?")
      - "5432:5432"
    environment:
      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are the standard
      # Postgres env vars consumed by the entrypoint script to create the
      # initial superuser and database.
      #
      # NEVER commit real values here.  In local dev these come from .env
      # (which is .gitignored).  In production (EKS) they come from a K8s
      # Secret mounted as env vars.
      POSTGRES_USER: "${TIMESCALEDB_USER:-driftwatch}"
      POSTGRES_PASSWORD: "${TIMESCALEDB_PASSWORD:-driftwatch_dev_pw}"
      POSTGRES_DB: "${TIMESCALEDB_DB:-driftwatch}"
    healthcheck:
      # pg_isready checks whether Postgres is accepting connections.
      # -U and -d match the credentials above.
      # We wait for this before the anomaly-detector starts so that the
      # detector's DB connection attempt doesn't fail on a cold start.
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${TIMESCALEDB_USER:-driftwatch} -d ${TIMESCALEDB_DB:-driftwatch}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      # Init script: runs once on first boot, creates hypertables.
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Persist the database across restarts.
      - timescaledb-data:/var/lib/postgresql/data

  # ── Grafana (Phase 3) ────────────────────────────────────────────────────── #
  #
  # WHY grafana/grafana-oss:13.0.2?
  #   Pinned to the current stable release (verified current).
  #   OSS = the open-source edition (no Enterprise features needed here).
  #   Pinning the version means the dashboard JSON in the repo was tested
  #   against exactly this Grafana version — important because dashboard
  #   schema versions do change across major releases.
  #
  # WHY provision via mounted config files instead of clicking in the UI?
  #   Provisioning files are checked into the repo and auto-loaded at startup.
  #   The datasource and dashboard JSON are version-controlled alongside the
  #   code that produces the data.  This is "dashboard-as-code" (README §4.5).
  #   Any developer cloning the repo gets the same dashboard on `docker compose up`.
  #
  # WHY GF_PATHS_PROVISIONING?
  #   Grafana looks for provisioning YAML files in this directory.
  #   We point it at the mounted volume containing datasources.yml and
  #   dashboards.yml so Grafana reads them on startup.
  #
  # WHY GF_AUTH_ANONYMOUS_ENABLED for local dev?
  #   Skipping login for local development removes friction when iterating
  #   on the dashboard.  This MUST be disabled in production — use Grafana's
  #   OAuth/LDAP integrations or a reverse proxy with auth instead.
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    networks:
      - driftwatch
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      # Grafana admin credentials (local dev only — never commit real values).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"

      # Point Grafana at the provisioning directory we mount below.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

      # Disable login for local dev convenience.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"

      # Credentials forwarded from Compose env → Grafana datasource provisioning.
      # The datasources.yml reads these via ${TIMESCALEDB_USER} etc.
      TIMESCALEDB_USER: "${TIMESCALEDB_USER:-driftwatch}"
      TIMESCALEDB_PASSWORD: "${TIMESCALEDB_PASSWORD:-driftwatch_dev_pw}"
      TIMESCALEDB_DB: "${TIMESCALEDB_DB:-driftwatch}"

      # Disable telemetry / update checks for offline environments.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Mount the provisioning configs (datasources + dashboards YAML).
      - ./services/dashboard-provisioning/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  # ── Log Producers ──────────────────────────────────────────────────────── #
  # Three replicas of the same image, each representing a different simulated
  # microservice in a different AWS region.  SERVICE_NAME and REGION are the
  # only differences — this is the "config via environment" principle from
  # README §2.3 in action.

  log-producer-auth:
    build:
      context: ./services/log-producer
      dockerfile: Dockerfile
    image: driftwatch/log-producer:latest
    container_name: log-producer-auth
    networks:
      - driftwatch
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "logs.raw"
      SERVICE_NAME: "auth-service"
      REGION: "us-east-1"
      EVENTS_PER_SECOND: "5"
      # Set ANOMALY_MODE to "latency_spike", "error_burst", or "unusual_status"
      # on the relevant container to inject labeled test anomalies.
      ANOMALY_MODE: ""
    ports:
      - "8081:8080"   # /healthz reachable at localhost:8081/healthz
    restart: unless-stopped

  log-producer-payments:
    build:
      context: ./services/log-producer
      dockerfile: Dockerfile
    image: driftwatch/log-producer:latest
    container_name: log-producer-payments
    networks:
      - driftwatch
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "logs.raw"
      SERVICE_NAME: "payments-service"
      REGION: "eu-west-1"
      EVENTS_PER_SECOND: "3"
      ANOMALY_MODE: ""
    ports:
      - "8082:8080"
    restart: unless-stopped

  log-producer-inventory:
    build:
      context: ./services/log-producer
      dockerfile: Dockerfile
    image: driftwatch/log-producer:latest
    container_name: log-producer-inventory
    networks:
      - driftwatch
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "logs.raw"
      SERVICE_NAME: "inventory-service"
      REGION: "ap-southeast-1"
      EVENTS_PER_SECOND: "4"
      ANOMALY_MODE: ""
    ports:
      - "8083:8080"
    restart: unless-stopped

  # ── Anomaly Detector ─────────────────────────────────────────────────────── #
  # Kafka consumer that scores each sliding window with a pre-trained Isolation
  # Forest and writes results to both stdout (for debugging, Phase 2 behaviour
  # preserved) and TimescaleDB (Phase 3 addition).
  #
  # Why depends_on kafka only (not the producers)?
  #   The detector reads whatever is already in the topic — it doesn't need
  #   producers to be running.  This means you can start the detector alone for
  #   testing without spinning up the full producer fleet.
  #
  # Why depends_on timescaledb condition:service_healthy?
  #   The detector opens a DB connection on startup.  If timescaledb isn't
  #   ready yet, psycopg2.connect() raises an OperationalError.  We let the
  #   health-check gate handle this rather than adding retry logic in Python
  #   (though the Python code also retries, as a belt-and-suspenders approach).
  #
  # Why auto_offset_reset=latest?
  #   On first start there may be many minutes of backlog.  Replaying it would
  #   produce a flood of stale windows before the sliding window stabilises,
  #   causing false anomaly alerts.  "latest" gives a clean start; you can
  #   change it to "earliest" to replay history intentionally.
  anomaly-detector:
    build:
      context: ./services/anomaly-detector
      dockerfile: Dockerfile
    image: driftwatch/anomaly-detector:latest
    container_name: anomaly-detector
    networks:
      - driftwatch
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "logs.raw"
      KAFKA_GROUP_ID: "driftwatch-anomaly-detector"
      # Model path inside the container (baked in during docker build).
      # To hot-swap the model without a rebuild: mount a volume over /app/models/
      # and point ANOMALY_MODEL_PATH at the mounted file.
      ANOMALY_MODEL_PATH: "/app/models/isolation_forest_v1.joblib"
      WINDOW_SECONDS: "30"
      WINDOW_SLIDE_SECONDS: "10"
      HEALTHZ_PORT: "8084"
      # ── TimescaleDB connection ────────────────────────────────────────────── #
      # Connection string for psycopg2.connect().  Credentials sourced from
      # .env (local dev) or K8s Secret (production).  The defaults match the
      # timescaledb service's POSTGRES_* env vars above.
      TIMESCALEDB_URL: "postgresql://${TIMESCALEDB_USER:-driftwatch}:${TIMESCALEDB_PASSWORD:-driftwatch_dev_pw}@timescaledb:5432/${TIMESCALEDB_DB:-driftwatch}"
    ports:
      - "8084:8084"   # /healthz reachable at localhost:8084/healthz
    restart: unless-stopped

# --------------------------------------------------------------------------- #
# Volumes                                                                       #
# --------------------------------------------------------------------------- #
volumes:
  # Named volume for Kafka's KRaft log directory.
  # Named volumes persist across container recreates; anonymous volumes do not.
  kafka-data:

  # Named volume for TimescaleDB's Postgres data directory.
  # Persists all metrics and anomaly rows across restarts.
  timescaledb-data:
