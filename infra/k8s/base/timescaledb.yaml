# timescaledb.yaml — TimescaleDB StatefulSet + Service + init.sql ConfigMap
#
# Design notes (AGENTS.md §1 — explain every choice):
#
# ── WHY StatefulSet for the database? ─────────────────────────────────────── #
#   Same core reasons as Kafka:
#
#   1. STABLE STORAGE IDENTITY: The database's PVC must follow the pod across
#      reschedules.  A Deployment pod might get rescheduled to a different
#      node; without StatefulSet's volumeClaimTemplate per-pod affinity,
#      the new pod would start with an EMPTY data directory (complete data
#      loss) or fail to mount the same PVC (most storage classes are
#      ReadWriteOnce — one node at a time).
#
#   2. ORDERED INIT: The StatefulSet ensures the TimescaleDB pod gets a
#      stable hostname (timescaledb-0) and predictable startup order,
#      which matters when the anomaly-detector and Grafana both try to
#      connect on boot.
#
#   3. PVC RETENTION: volumeClaimTemplates creates timescaledb-data-timescaledb-0.
#      kubectl delete pod timescaledb-0 → pod restarts, finds its data intact.
#      kubectl delete statefulset timescaledb → by default PVCs survive
#      (persistentVolumeClaimRetentionPolicy: Retain).
#
# ── WHY mount init.sql as a ConfigMap? ────────────────────────────────────── #
#   In docker-compose.yml we bind-mounted ./infra/timescaledb/init.sql from
#   the host.  Kubernetes doesn't have direct host bind mounts in production
#   (and Kind nodes don't share the host's filesystem for arbitrary paths).
#   The idiomatic solution is: read init.sql into a ConfigMap at deploy time
#   (Kustomize does this with configMapGenerator), then mount it as a volume
#   inside the container at /docker-entrypoint-initdb.d/.
#   TimescaleDB (Postgres) auto-runs every .sql file in that directory on
#   first boot — exactly the same mechanism as docker-compose.
---
# ConfigMap holding the init.sql schema.
# Created by kustomize configMapGenerator (see base/kustomization.yaml)
# and referenced here by name.  We don't inline it here to avoid duplicating
# the SQL — Kustomize reads it from the file on disk and hashes the name so
# changes trigger pod restarts automatically.
# NOTE: actual ConfigMap is generated by Kustomize; this comment documents intent.

---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  labels:
    app: timescaledb
    app.kubernetes.io/part-of: driftwatch
spec:
  selector:
    app: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels:
    app: timescaledb
    app.kubernetes.io/part-of: driftwatch
spec:
  serviceName: timescaledb   # ties pods to the ClusterIP service
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16   # pinned to pg16 per docker-compose
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # ── Postgres / TimescaleDB credentials ────────────────────────── #
            # Sourced from Secret to keep credentials out of ConfigMap.
            # See secret.yaml for values (placeholder defaults for now).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: driftwatch-secret
                  key: TIMESCALEDB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: driftwatch-secret
                  key: TIMESCALEDB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: driftwatch-config
                  key: TIMESCALEDB_DB

          # ── Health probes ─────────────────────────────────────────────────── #
          # pg_isready checks whether Postgres accepts connections — same as
          # the docker-compose healthcheck.  We run it against the POSTGRES_USER
          # directly since that env var is set above.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U driftwatch -d driftwatch
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U driftwatch -d driftwatch
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          # ── Resources ─────────────────────────────────────────────────────── #
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Volume mounts ──────────────────────────────────────────────────── #
          volumeMounts:
            # init.sql from ConfigMap: Postgres runs it once on first boot
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
              readOnly: true
            # Persistent data: PVC reattaches on pod restart (StatefulSet guarantee)
            - name: timescaledb-data
              mountPath: /var/lib/postgresql/data

      volumes:
        # The init-sql ConfigMap is generated by Kustomize from infra/timescaledb/init.sql
        - name: init-sql
          configMap:
            name: timescaledb-init-sql

  # ── volumeClaimTemplates ──────────────────────────────────────────────────── #
  # Creates PVC timescaledb-data-timescaledb-0 exclusively for this pod.
  # PVCs outlive pod deletions by default, protecting data during restarts.
  volumeClaimTemplates:
    - metadata:
        name: timescaledb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
