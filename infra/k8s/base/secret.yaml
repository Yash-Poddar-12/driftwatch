# secret.yaml — Credentials for DriftWatch services
#
# Design notes (AGENTS.md §1 — explain every choice):
#
# WHY a Kubernetes Secret instead of a ConfigMap?
#   Kubernetes Secrets get a distinct RBAC type (Kind: Secret), can be
#   encrypted at rest (when configured), and are scrubbed from kubectl
#   describe output.  They are the correct abstraction even when values
#   are placeholder defaults — because the structure (how the manifest
#   references the credential) must be correct now so that swapping in a
#   real secret management system (AWS Secrets Manager, sealed-secrets,
#   External Secrets Operator) later requires zero manifest changes.
#
# IMPORTANT — these are NOT real secrets.
#   Values here are base64(placeholder_default) — identical to what
#   docker-compose.yml uses.  They are NOT gitignored because they are
#   not real credentials.  Real secrets MUST be replaced before any
#   AWS/EKS deployment via sealed-secrets or External Secrets Operator.
#   See Rule 1 in AGENTS.md.
#
# Base64 encoding:
#   Kubernetes Secrets require values to be base64-encoded in the data
#   field (or you can use stringData and Kubernetes will encode for you).
#   We use stringData here for readability — it's semantically identical
#   to base64-encoding in data: {}, just easier to review in a diff.
#
# NEVER store real credentials here — use stringData only for clearly
# documented placeholder values that match .env.example defaults.
apiVersion: v1
kind: Secret
metadata:
  name: driftwatch-secret
  labels:
    app.kubernetes.io/part-of: driftwatch
type: Opaque
stringData:
  # ── TimescaleDB credentials ──────────────────────────────────────────────── #
  # Placeholder values — identical to .env.example defaults.
  # Replace with real credentials via sealed-secrets before EKS deployment.
  TIMESCALEDB_USER: "driftwatch"
  TIMESCALEDB_PASSWORD: "driftwatch_dev_pw"

  # Full psycopg2 connection URL assembled from the above components.
  # Used directly by the anomaly-detector (TIMESCALEDB_URL env var).
  TIMESCALEDB_URL: "postgresql://driftwatch:driftwatch_dev_pw@timescaledb:5432/driftwatch"

  # ── Grafana credentials ──────────────────────────────────────────────────── #
  GRAFANA_ADMIN_PASSWORD: "admin"
